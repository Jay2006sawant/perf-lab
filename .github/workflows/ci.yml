# SPDX-License-Identifier: CC-BY-4.0
name: ran-perf-lab
on:
  push:
    paths:
      - "LFX/perf-lab/**"
  pull_request:
    paths:
      - "LFX/perf-lab/**"
jobs:
  build-test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: LFX/perf-lab
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build python3-matplotlib
      - name: CI
        run: chmod +x scripts/*.sh && ./scripts/ci_local.sh
