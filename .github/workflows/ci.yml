name: ran-perf-lab
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build python3-matplotlib
      - name: CI
        run: chmod +x scripts/*.sh && ./scripts/ci_local.sh
